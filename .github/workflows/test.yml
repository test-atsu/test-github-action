name: GitHub Actions Demo

on: [push]

jobs:
  echo_hello_world:
    runs-on: ubuntu-latest
    steps:
      - name: Greetings
        run: echo "hello world!!"
      - name: Check current directory
        run: pwd
      - name: Check files in current directory
        run: ls -al
      - name: compile
        run: gcc -o main src/main.c
